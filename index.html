<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--b:#0b5d4b;--y:#f5b700;--bg:#f2f5f4;--c:#fff;--t:#1b2430;--m:#5d6b7c;--l:#dde3ea;--g:#128c4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:12px 14px 10px;padding-top:max(12px,env(safe-area-inset-top))}
header h1{margin:0;font-size:19px;line-height:1.25}
header .sub{font-size:13px;opacity:.85;margin-top:3px}
.bar{position:sticky;top:0;z-index:5;background:var(--b);padding:0 10px 10px;display:flex;gap:8px}
.bar input{flex:1;min-width:0;font-size:16px;padding:11px 12px;border-radius:10px;border:0}
.bar button{font-size:15px;padding:0 14px;border-radius:10px;border:0;background:var(--y);color:#222;font-weight:700;white-space:nowrap}
#panel{background:var(--c);border-bottom:1px solid var(--l);padding:6px 12px 12px}
#panel.hide{display:none}
.row{margin-top:10px}
.lab{font-size:13px;color:var(--m);margin-bottom:5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--l);background:#f8fafc;border-radius:20px;padding:8px 12px;font-size:15px;min-height:40px;color:var(--t)}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.seg{display:flex;border:1px solid var(--b);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 0;font-size:16px;color:var(--b);min-height:44px}
.seg button.on{background:var(--b);color:#fff;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column}
.f span{font-size:12px;color:var(--m);margin-bottom:3px}
.f input,.f select{font-size:16px;padding:9px 10px;border:1px solid var(--l);border-radius:9px;background:#fff;min-height:44px;width:100%}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;min-height:46px;font-size:16px;border-radius:10px;border:1px solid var(--b);background:#fff;color:var(--b)}
.acts button.pri{background:var(--b);color:#fff;font-weight:700}
#info{padding:10px 14px 4px;font-size:14px;color:var(--m);display:flex;justify-content:space-between;align-items:center;gap:8px}
#info select{font-size:15px;padding:6px;border-radius:8px;border:1px solid var(--l);background:#fff}
#list{padding:4px 10px 30px}
.card{background:var(--c);border-radius:12px;padding:12px 13px;margin:9px 0;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid #e8edf2}
.card h3{margin:0 0 5px;font-size:16.5px;line-height:1.35}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px;color:#fff}
.tS{background:#c0392b}.tR{background:#2471a3}.tB{background:#7d3c98}
.spec{font-size:14.5px;color:#26313d;margin:3px 0}
.price{font-weight:700;color:#a3360b;font-size:16px;margin:4px 0}
.price small{color:var(--m);font-weight:400;font-size:13px}
.ag{margin:7px 0 2px;font-size:15px}
.ag a,.also a{color:var(--g);font-weight:700;text-decoration:none;padding:3px 0;display:inline-block}
.small{font-size:13px;color:var(--m)}
.also{font-size:13.5px;margin-top:4px;color:#33404d}
.also summary{cursor:pointer;color:var(--m)}
.also div{padding:2px 0}
.rawb{margin-top:6px;border:0;background:none;color:var(--b);font-size:14px;padding:6px 0;text-decoration:underline}
.cpb{display:none;margin-top:8px;min-height:44px;padding:10px 18px;border:1px solid var(--b);border-radius:10px;background:#fff;color:var(--b);font-size:15px;font-weight:600;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cpb.show{display:inline-block}.cpb.ok{background:var(--b);color:#fff}
.raw{white-space:pre-wrap;font-size:13.5px;background:#f7f9fa;border-radius:8px;padding:8px;margin-top:6px;max-height:420px;overflow:auto;word-break:break-word}

footer{font-size:12.5px;color:var(--m);padding:6px 16px 40px;line-height:1.6}
.empty{text-align:center;color:var(--m);padding:40px 10px}
@media(min-width:760px){#list,#panel,#info,footer{max-width:760px;margin-left:auto;margin-right:auto}.bar{justify-content:center}.bar input{max-width:600px}}
</style>
</head>

<header>
  <h1>TPG 柔佛住宅配对 Residential Finder</h1>

    <button class="chip" data-v="ld">有地(全部) Landed</button>
    <button class="chip" data-v="terrace">排屋 Terrace</button>
    <button class="chip" data-v="cluster">田字 Cluster</button>
    <button class="chip" data-v="semi">半独立 Semi-D</button>
    <button class="chip" data-v="bung">独立 Bungalow</button>
    <button class="chip" data-v="town">Townhouse</button>
  </div></div>
  <div class="row grid">
    <label class="f"><span>地区 Area</span><select id="area"><option value="">全部 All</option></select></label>
    <label class="f"><span>层数 Storeys (landed)</span><select id="sty"><option value="">不限 Any</option><option>1</option><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option>3.5</option><option>4</option></select></label>

    <label class="f"><span>最小屋身 Min build-up (sqft)</span><input id="bu" inputmode="numeric" placeholder="例 1000"></label>
    <label class="f"><span>最小土地 Min land (sqft)</span><input id="land" inputmode="numeric" placeholder="例 1400 (20x70)"></label>
    <label class="f"><span id="pminl">最低价 Min price (RM)</span><input id="pmin" inputmode="decimal" placeholder="例 300k"></label>
    <label class="f"><span id="pmaxl">最高价 Max price (RM)</span><input id="pmax" inputmode="decimal" placeholder="例 800k / 1.2m / 2000"></label>
    <label class="f"><span>家私 Furnishing</span><select id="furn"><option value="">不限 Any</option><option value="F">全家私 Fully</option><option value="P">半家私 Partly</option><option value="B">空屋 Bare</option></select></label>

    <label class="f"><span>土著 Bumi</span><select id="bumi"><option value="">不限 Any</option><option value="N">非土著 Non-Bumi / Intl</option><option value="B">土著 Bumi lot</option></select></label>
    <label class="f"><span>群组 Source group</span><select id="grp"><option value="">全部 All</option></select></label>
  </div>
  <div class="acts"><button id="reset">重置 Reset</button><button id="go" class="pri">搜索 Search</button></div>
</div>
<div id="info"><span id="cnt">载入中 Loading…</span>
  <select id="sort"><option value="p">价格 低→高</option><option value="pd">价格 高→低</option><option value="n">最新 Newest</option><option value="psf">psf 低→高</option><option value="bu">屋身 大→小</option><option value="ld">土地 大→小</option></select></div>
<div id="list"></div>
<footer id="foot"></footer>
<script src="data.js"></script>
